name: Refresh artwork

# Regenerates artwork.json from the credits sheet so newly added albums get
# cover art. Runs weekly and can be triggered manually from the Actions tab.
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build artwork map
        run: node build-artwork.mjs
      - name: Commit if changed
        run: |
          if ! git diff --quiet artwork.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add artwork.json
            git commit -m "Refresh artwork.json"
            git push
          else
            echo "No artwork changes."
          fi
